# Pages CMS configuration (https://pagescms.org)
# Write & publish Insights posts from a browser editor. Posts are saved as
# Markdown into src/content/insights/ and images into public/assets/insights/;
# committing them triggers a Netlify rebuild.

media:
  - name: insights
    input: public/assets/insights
    output: /assets/insights
  - name: testimonials
    input: public/assets/testimonials
    output: /assets/testimonials

content:
  - name: insights
    label: Insights (Blog)
    type: collection
    path: src/content/insights
    filename: '{fields.title}.md'
    view:
      fields: [title, category, date, draft]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
      search: true
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Summary (card + fallback SEO)
        type: text
        required: true
        description: One line. What the reader walks away able to do, not what the post covers.
      - name: category
        label: Category
        type: select
        required: true
        options:
          values: [Tech Sales, Marketing & Ads, Go-To-Market, Building, Creative, Essays]
      - name: date
        label: Publish date
        type: date
        options:
          format: yyyy-MM-dd
        required: true
      - name: author
        label: Author
        type: string
        default: Levi Henry
      - name: tags
        label: Tags
        type: string
        list: true
      - name: cover
        label: Cover image
        type: image
        options:
          media: insights
      - name: coverAlt
        label: Cover alt text
        type: string
        description: Describe the image for screen readers and image search.
      - name: seoTitle
        label: SEO title (optional)
        type: string
        description: ~60 characters. Leave blank to use the post title.
      - name: seoDescription
        label: SEO meta description (optional)
        type: text
        description: 150-160 characters. Leave blank to use the summary above.
      - name: featured
        label: Feature at the top of Insights
        type: boolean
      - name: draft
        label: Draft (hide from the live site)
        type: boolean
        default: false
      - name: body
        label: Article
        type: rich-text
        required: true

  - name: testimonials
    label: Testimonials
    type: collection
    path: src/content/testimonials
    filename: '{fields.name}.md'
    view:
      fields: [name, type, featured, order, draft]
      primary: name
      sort: [order, name]
      default:
        sort: order
        order: asc
      search: true
    fields:
      - name: type
        label: Type
        type: select
        required: true
        default: text
        options:
          values: [text, video]
      - name: name
        label: Name
        type: string
        required: true
      - name: role
        label: Role / company
        type: string
        description: e.g. "Founder, The Lauren Henry"
      - name: quote
        label: Quote (text testimonials)
        type: text
        description: The client's words. Required for text testimonials.
      - name: proof
        label: Proof screenshot (optional)
        type: image
        options:
          media: testimonials
        description: The real message/screenshot. Shown as a thumbnail that enlarges on tap.
      - name: proofAlt
        label: Proof alt text
        type: string
      - name: avatar
        label: Avatar / logo (text testimonials, optional)
        type: image
        options:
          media: testimonials
      - name: video
        label: Video path (video testimonials)
        type: string
        description: e.g. /assets/video/testimonial-name.mp4 (upload the MP4 to that folder)
      - name: poster
        label: Poster image (video testimonials)
        type: image
        options:
          media: testimonials
      - name: featured
        label: Feature first
        type: boolean
      - name: order
        label: Sort order (lower shows first)
        type: number
        default: 100
      - name: draft
        label: Draft (hide from the live site)
        type: boolean
        default: false
