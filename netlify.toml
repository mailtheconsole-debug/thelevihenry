# Netlify configuration — Astro static build + serverless functions
[build]
  command = "astro build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Long-cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# Hashed build bundles (Astro JS/CSS in /_astro/). The filename changes
# whenever the content changes, so these are safe to cache immutably.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
