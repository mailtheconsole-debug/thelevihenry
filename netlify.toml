# Netlify configuration — Astro static build + serverless functions
[build]
  command = "astro build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# The daily follow-up email send runs in followup-send-background.cjs, a BACKGROUND
# function (15-minute budget, returns 202 at once) so a big batch can never hit the
# 10-second synchronous timeout. An external scheduler (cron-job.org) calls it once a
# day over HTTP with the x-followup-key header. followup-cron.cjs is the synchronous
# sibling for ?report=1 diagnostics and a capped manual catch-up. Both are key-gated.

# Long-cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# Hashed build bundles (Astro JS/CSS in /_astro/). The filename changes
# whenever the content changes, so these are safe to cache immutably.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
