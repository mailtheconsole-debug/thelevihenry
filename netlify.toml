# Netlify configuration — Astro static build + serverless functions
[build]
  command = "astro build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# The daily follow-up email job (followup-cron) is NOT run by a Netlify schedule.
# A GitHub Action (.github/workflows/followup-emails.yml) calls it over HTTP once a
# day, which runs on the same path that email 1 and the worklist use and gives us
# visible runs plus a manual "run now" button. The function is key-gated.

# Long-cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# Hashed build bundles (Astro JS/CSS in /_astro/). The filename changes
# whenever the content changes, so these are safe to cache immutably.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
